[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reckonme"
version = "0.1.0"
description = "Evidence-driven attack-surface intelligence (foundation)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reckonme = "reckonme.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
